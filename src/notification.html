<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification</title>
    <style>
        /* Общие стили */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Контейнер */
        .container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        /* Заголовок и время в одну строку */
        .title-time {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            color: #1c8bf6;
        }
        .time {
            font-size: 18px;
            font-weight: bold;
            color: #555252;
        }

        /* Локация */
        .location {
            font-size: 16px;
            margin-top: 10px;
            color: #153b8e;
        }

        /* Описание */
        .description {
            font-size: 14px;
            margin-top: 15px;
            color: #666;
            line-height: 1.5;
        }

        /* Кнопка */
        #closeButton {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            color: #fff;
            background-color: #3498db;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #closeButton:hover {
            background-color: #2980b9;
        }
    </style>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
<div class="container">
    <div class="title" id="eventTitle"></div>
    <div class="time" id="eventTime"></div>
    <div class="location" id="eventLocation"></div>
<!--    <div class="description" id="eventDescription"></div>-->
    <button id="closeButton">Close</button>
</div>
<audio src="assets/notification_sound.mp3" autoplay></audio>
<script src="notification.js"></script>
</body>
</html>
