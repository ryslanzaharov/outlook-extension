<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification</title>
    <style>
        /* Общие стили */
        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            /*justify-content: center;*/
            min-width: 300px;
        }

        /* Контейнер */
        .container {
            background-color: #fff;
            padding: 25px;
            max-width: 400px;
            text-align: center;
        }

        .header {
            margin-bottom: 5px;
            text-align: left;
        }

        .title {
            font-size: 20px;
            font-weight: 600;
            color: #201f1e;
            margin: 0;
            word-wrap: break-word; /* Перенос слов при превышении ширины */
            max-width: 300px; /* Ограничение ширины заголовка */
        }

        .top-right {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .external-link {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .time {
            font-size: 15px;
            color: #605e5c;
            margin: 5px 0;
            text-align: left;
            display: flex;
            align-items: flex-start; /* Выравнивание по верху для многострочного текста */
            gap: 5px;
        }

        .location {
            font-size: 15px;
            color: #0078d4;
            margin: 5px 0;
            text-align: left;
            display: flex;
            align-items: flex-start; /* Выравнивание по верху для многострочного текста */
            gap: 5px;
        }

        .text-content {
            word-wrap: break-word; /* Перенос слов для времени и локации */
            max-width: 300px; /* Ограничение ширины текста */
        }

        .icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0; /* Иконка не сжимается */
        }

        #closeButton {
            width: 20px;
            height: 20px;
            padding: 0;
            font-size: 35px;
            color: #605e5c;
            background-color: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 20px;
        }

        #closeButton:hover {
            color: #201f1e;
            background-color: #f3f2f1;
            border-radius: 2px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-right">
        <img src="./images/external-link.png" class="external-link" alt="Open link" title="Open in Outlook">
        <button id="closeButton">×</button>
    </div>
    <div class="header">
        <div class="title" id="eventTitle"></div>
    </div>
    <div class="time">
        <img src="./images/time-18.png" class="icon" alt="Time">
        <span class="text-content" id="eventTime"></span>
    </div>
    <div class="location">
        <img src="./images/location-18.png" class="icon" alt="Location">
        <span class="text-content" id="eventLocation"></span>
    </div>
</div>
<audio src="assets/notification_sound.mp3" autoplay></audio>
<script src="notification.js"></script>
</body>
</html>
