<!DOCTYPE html>
<html lang="en">
<head>
    <title>Outlook Calendar Checker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="main" class="header">
    <div id="title" class="title">Outlook Calendar Checker</div>
    <div class="icons">
        <a id="support" class="link" href="https://mail.google.com/mail/u/0/?view=cm&fs=1&to=ruslan.ext.dev@gmail.com&su=Outlook%20Calendar%20Checker&body=Hello,%20I%20would%20like%20to%20suggest%20you%20to%20do" target="_blank">
            <img src="./images/support.png" alt="Support" title="Support" class="icon">
        </a>
        <a id="owaCalendar" class="link" href="https://outlook.live.com/calendar/0/view/day" target="_blank">
        <img src="./images/external-link.png" alt="Calendar" title="Open OWA" class="icon">
    </a>
    <button id="logoutButton" class="logout-button">
        <img src="./images/logout.png" alt="Logout" title="Logout" class="icon">
    </button>
    </div>
</div>
<div id="calendar-container">
    <div id="calendar"></div>
    <button id="createEventButton" class="create-event-button">
        <img src="./images/plus.png" alt="Create event" title="Create event">
    </button>
</div>

<!--<button id="createEventButton" class="create-event-button">Create Event</button>-->
<!--<div id="calendar"></div>-->
<div id="modal" class="modal hidden">
    <div class="modal-content">
        <span id="closeModal" class="close">&times;</span>
        <div id="modalBody">
            <!-- Данные о созвонах будут вставлены сюда -->
        </div>
    </div>
</div>

<!--<button id="loginButton">Log in of Microsoft Account</button>-->
<!--<button id="logoutButton">Log out of Microsoft Account</button>-->
</body>
</html>
